<section class="game-detail">
  <div class="container">
    <div class="game-detail__back fade-in-up">
      <a routerLink="/" class="btn btn--ghost">← Volver al inicio</a>
    </div>

    <div class="game-detail__placeholder fade-in-up">
      <div class="game-detail__icon">🎮</div>
      <h1 class="game-detail__title">Detalle del Juego</h1>
      <p class="game-detail__id">
        ID: <span class="text-red">{{ gameId }}</span>
      </p>
      <p class="game-detail__desc">
        La vista completa del juego llegará en el <span class="text-red">Día 6</span>
      </p>
    </div>
  </div>
</section>
