<section class="favorites">
  <div class="container">
    <div class="favorites__header fade-in-up">
      <h1 class="favorites__title">
        Mis <span class="text-red">Favoritos</span>
      </h1>
      <p class="favorites__subtitle">
        Tus juegos guardados aparecerán aquí
      </p>
    </div>

    @if (favoriteGames().length > 0) {
      <div class="favorites__grid fade-in-up">
        @for (game of favoriteGames(); track game.id) {
          <app-game-card [game]="game" />
        }
      </div>
    } @else {
      <div class="favorites__empty fade-in-up">
        <span class="favorites__empty-icon">💔</span>
        <p class="favorites__empty-text">¡Tu lista está vacía! Explora y agrega juegos</p>
        <a routerLink="/" class="btn btn--primary">Explorar juegos</a>
      </div>
    }
  </div>
</section>
